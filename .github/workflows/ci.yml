name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile gate scripts
        run: python3 -m py_compile scripts/gate.py scripts/service_account_gate.py scripts/balkanid_api.py scripts/trigger_sync.py

      - name: Block tracked secret files
        run: |
          for f in .env terraform/bedrock/terraform.tfstate; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Sensitive file must not be tracked: $f"
              exit 1
            fi
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Validate gate stack
        working-directory: terraform
        run: |
          terraform init -backend=false
          TF_VAR_api_key_id=ci-dummy \
          TF_VAR_api_key_secret=ci-dummy \
          TF_VAR_agent_owner_email=ci@example.com \
          terraform validate

      - name: Validate Bedrock stack
        working-directory: terraform/bedrock
        run: |
          terraform init -backend=false
          TF_VAR_aws_credentials_file=/dev/null \
          TF_VAR_aws_account_id=123456789012 \
          terraform validate

  iam-policy:
    name: IAM policy JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: jq empty aws/bedrock-agent-lifecycle-iam-policy.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --only-verified
