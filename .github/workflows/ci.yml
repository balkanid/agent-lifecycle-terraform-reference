name: CI

on:
  pull_request:
    branches: [main, EN-8896]
  push:
    branches: [main, EN-8896]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile and import scripts
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          python3 scripts/verify_imports.py

      - name: Unit tests (mock BalkanID API)
        run: python3 -m unittest discover -s tests -v

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Block tracked secret files
        run: |
          for f in .env .approved-scope.json terraform/bedrock/terraform.tfstate; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Sensitive file must not be tracked: $f"
              exit 1
            fi
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Validate gate stack
        working-directory: terraform
        run: |
          terraform init -backend=false
          TF_VAR_api_key_id=ci-dummy \
          TF_VAR_api_key_secret=ci-dummy \
          TF_VAR_agent_owner_email=ci@example.com \
          terraform validate

      - name: Validate Bedrock stack
        working-directory: terraform/bedrock
        run: |
          terraform init -backend=false
          TF_VAR_aws_credentials_file=/dev/null \
          TF_VAR_aws_account_id=123456789012 \
          terraform validate

      - name: Validate other stacks
        run: |
          for dir in bedrock-guardrails grant-policies agent-role copilot copilot-studio entra-agent-identity; do
            echo "::group::terraform/${dir}"
            terraform -chdir="terraform/${dir}" init -backend=false -input=false
            terraform -chdir="terraform/${dir}" validate
            echo "::endgroup::"
          done

  iam-policy:
    name: Policy JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON
        run: |
          for f in aws/*.json azure/*.json policies/*.json; do jq empty "$f"; done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified
