name: Bedrock developer-agent reaper

# Destroys every agent whose BalkanID-approved expiry has passed, children before parents.
# Needs the same remote Terraform backend as the lifecycle workflow. Off until you set the
# repository variable REAPER_ENABLED=true (job-level `if` cannot see environment variables), so a fork or an unconfigured copy does
# not fail every hour without credentials.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: bedrock-guardrails-reaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reap:
    if: vars.REAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bedrock-guardrails
    env:
      LIFECYCLE_TARGET: bedrock-guardrails
      BALKANID_PUBLIC_API_URL: ${{ secrets.BALKANID_PUBLIC_API_URL }}
      API_KEY_ID: ${{ secrets.BALKANID_API_KEY_ID }}
      API_KEY_SECRET: ${{ secrets.BALKANID_API_KEY_SECRET }}
      INTEGRATION_ID: ${{ secrets.BALKANID_INTEGRATION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: List expired agents
        run: python3 scripts/reap_expired.py
      - name: Destroy expired agents
        run: python3 scripts/reap_expired.py --destroy
