name: CD

# Runs BalkanID approval gates, then optionally terraform apply, then syncIntegration.
# Gates (apply): service_account_gate.py → gate.py (each optional via env / workflow inputs)
# Flow: gates (approval only) → terraform apply (role + harness) → syncIntegration
#
# Configure the agent-lifecycle GitHub environment:
#   Variables — non-sensitive defaults (see .github/CD_CONFIG.md)
#   Secrets   — API keys and AWS credentials

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      provision_aws_agent:
        description: Provision AWS agent after gates (AgentCore harness or Classic)
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "true"
          - "false"
      service_account_gate:
        description: Run CREATE_SERVICE_ACCOUNT approval gate before agent gate
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "true"
          - "false"
      agent_gate:
        description: Run AGENT_ACCESS approval gate
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "true"
          - "false"
      agent_backend:
        description: AWS agent backend when provisioning
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - agentcore
          - classic
      trigger_integration_sync:
        description: Call syncIntegration after successful Terraform apply
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "true"
          - "false"
      approval_wait_minutes:
        description: Max minutes to wait for BalkanID approval
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "30"
          - "60"
          - "120"
          - "240"
          - "360"
      poll_seconds:
        description: Seconds between approval status polls
        required: true
        default: use-env
        type: choice
        options:
          - use-env
          - "5"
          - "10"
          - "15"
          - "30"
          - "60"
      agent_name:
        description: Agent / Terraform resource name (blank = use AGENT_NAME env var)
        required: false
        default: ""
        type: string

concurrency:
  group: agent-lifecycle-cd-${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: "${{ github.event.inputs.operation }} (${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: agent-lifecycle
    env:
      PROVISION_AWS_AGENT: ${{ github.event.inputs.provision_aws_agent == 'use-env' && (vars.PROVISION_AWS_AGENT || 'false') || github.event.inputs.provision_aws_agent }}
      SERVICE_ACCOUNT_GATE: ${{ github.event.inputs.service_account_gate == 'use-env' && (vars.SERVICE_ACCOUNT_GATE || 'false') || github.event.inputs.service_account_gate }}
      AGENT_GATE: ${{ github.event.inputs.agent_gate == 'use-env' && (vars.AGENT_GATE || 'true') || github.event.inputs.agent_gate }}
      APPROVAL_WAIT_MINUTES: ${{ github.event.inputs.approval_wait_minutes == 'use-env' && (vars.APPROVAL_WAIT_MINUTES || '120') || github.event.inputs.approval_wait_minutes }}
      POLL_SECONDS: ${{ github.event.inputs.poll_seconds == 'use-env' && (vars.POLL_SECONDS || '5') || github.event.inputs.poll_seconds }}
      AGENT_NAME: ${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }}
      AGENT_BACKEND: ${{ github.event.inputs.agent_backend == 'use-env' && (vars.AGENT_BACKEND || 'agentcore') || github.event.inputs.agent_backend }}
      TRIGGER_INTEGRATION_SYNC: ${{ github.event.inputs.trigger_integration_sync == 'use-env' && (vars.TRIGGER_INTEGRATION_SYNC || 'true') || github.event.inputs.trigger_integration_sync }}
      AGENT_PURPOSE: ${{ vars.AGENT_PURPOSE || 'Agent provisioned via Terraform with BalkanID approval' }}
      SERVICE_ACCOUNT_POLICY_NAME: ${{ vars.SERVICE_ACCOUNT_POLICY_NAME || vars.LIFECYCLE_POLICY_NAME || 'AmazonBedrockFullAccess' }}
      SERVICE_ACCOUNT_ROLE_NAME: ${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.SERVICE_ACCOUNT_ROLE_NAME || vars.AGENT_NAME || 'demo-support-agent' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_LOG: ERROR
      TF_INPUT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        if: env.PROVISION_AWS_AGENT == 'true'
        with:
          terraform_version: 1.12.2

      - name: Restore Terraform state
        if: env.PROVISION_AWS_AGENT == 'true'
        uses: actions/cache@v4
        with:
          path: |
            terraform/bedrock/.terraform
            terraform/bedrock/terraform.tfstate
            terraform/bedrock/terraform.tfstate.backup
          key: tfstate-bedrock-${{ env.AGENT_NAME }}-${{ github.ref_name }}
          restore-keys: |
            tfstate-bedrock-${{ env.AGENT_NAME }}-

      - name: Write AWS credentials file
        if: env.PROVISION_AWS_AGENT == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set +x
          umask 077
          printf '%s\n' '[terraform]' "aws_access_key_id = ${AWS_ACCESS_KEY_ID}" "aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}" > /tmp/terraform-aws-credentials

      - name: Resolve AWS account id
        if: env.PROVISION_AWS_AGENT == 'true' || env.SERVICE_ACCOUNT_GATE == 'true' || env.AGENT_GATE == 'true'
        id: aws_account
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set +x
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]]; then
            account_id="$(aws sts get-caller-identity --query Account --output text)"
          elif [[ -n "${{ vars.AWS_ACCOUNT_ID }}" ]]; then
            account_id="${{ vars.AWS_ACCOUNT_ID }}"
          else
            echo "::error::AWS account id required for gates (set AWS secrets or AWS_ACCOUNT_ID variable)"
            exit 1
          fi
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved AWS account (last 4 digits): ***${account_id: -4}"

      - name: Service account gate
        if: github.event.inputs.operation == 'apply' && env.SERVICE_ACCOUNT_GATE == 'true'
        env:
          BALKANID_PUBLIC_API_URL: ${{ secrets.BALKANID_PUBLIC_API_URL || vars.BALKANID_PUBLIC_API_URL }}
          BALKANID_AGENT_OWNER_EMAIL: ${{ secrets.BALKANID_AGENT_OWNER_EMAIL || vars.BALKANID_AGENT_OWNER_EMAIL }}
          API_KEY_ID: ${{ secrets.BALKANID_API_KEY_ID }}
          API_KEY_SECRET: ${{ secrets.BALKANID_API_KEY_SECRET }}
          INTEGRATION_ID: ${{ secrets.BALKANID_INTEGRATION_ID || vars.BALKANID_INTEGRATION_ID }}
          AWS_ACCOUNT_ID: ${{ steps.aws_account.outputs.account_id }}
          SERVICE_ACCOUNT_POLICY_NAME: ${{ env.SERVICE_ACCOUNT_POLICY_NAME }}
          SERVICE_ACCOUNT_ROLE_NAME: ${{ env.SERVICE_ACCOUNT_ROLE_NAME }}
          POLL_SECONDS: ${{ env.POLL_SECONDS }}
        run: |
          set +x
          export POLL_TIMEOUT_SECONDS=$((APPROVAL_WAIT_MINUTES * 60))
          echo "::notice::Service account gate — poll every ${POLL_SECONDS}s, up to ${APPROVAL_WAIT_MINUTES} minutes"
          python3 scripts/service_account_gate.py

      - name: Agent access gate
        if: github.event.inputs.operation == 'apply' && env.AGENT_GATE == 'true'
        env:
          BALKANID_PUBLIC_API_URL: ${{ secrets.BALKANID_PUBLIC_API_URL || vars.BALKANID_PUBLIC_API_URL }}
          BALKANID_AGENT_OWNER_EMAIL: ${{ secrets.BALKANID_AGENT_OWNER_EMAIL || vars.BALKANID_AGENT_OWNER_EMAIL }}
          API_KEY_ID: ${{ secrets.BALKANID_API_KEY_ID }}
          API_KEY_SECRET: ${{ secrets.BALKANID_API_KEY_SECRET }}
          INTEGRATION_ID: ${{ secrets.BALKANID_INTEGRATION_ID || vars.BALKANID_INTEGRATION_ID }}
          AWS_ACCOUNT_ID: ${{ steps.aws_account.outputs.account_id }}
          SERVICE_ACCOUNT_ROLE_NAME: ${{ env.SERVICE_ACCOUNT_ROLE_NAME }}
          AGENT_TYPE: terraform
          POLL_SECONDS: ${{ env.POLL_SECONDS }}
        run: |
          set +x
          export POLL_TIMEOUT_SECONDS=$((APPROVAL_WAIT_MINUTES * 60))
          echo "::notice::Agent access gate — poll every ${POLL_SECONDS}s, up to ${APPROVAL_WAIT_MINUTES} minutes"
          echo "::notice::Open your tenant → Access Requests while this job runs."
          python3 scripts/gate.py

      - name: Terraform init
        if: env.PROVISION_AWS_AGENT == 'true'
        working-directory: terraform/bedrock
        run: terraform init -input=false

      - name: AgentCore pre-apply reconciliation
        if: github.event.inputs.operation == 'apply' && env.PROVISION_AWS_AGENT == 'true' && env.AGENT_BACKEND == 'agentcore'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AGENT_NAME: ${{ env.AGENT_NAME }}
          AGENT_BACKEND: ${{ env.AGENT_BACKEND }}
        run: bash scripts/cleanup-agentcore-before-apply.sh

      - name: Terraform apply (AWS agent)
        if: github.event.inputs.operation == 'apply' && env.PROVISION_AWS_AGENT == 'true'
        working-directory: terraform/bedrock
        env:
          TF_VAR_aws_credentials_file: /tmp/terraform-aws-credentials
          TF_VAR_aws_account_id: ${{ steps.aws_account.outputs.account_id }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_agent_name: ${{ env.AGENT_NAME }}
          TF_VAR_agent_backend: ${{ env.AGENT_BACKEND }}
        run: |
          set +x
          echo "::notice::Applying AWS agent backend=${AGENT_BACKEND}"
          terraform apply -auto-approve -input=false -no-color

      - name: Trigger integration sync
        if: github.event.inputs.operation == 'apply' && env.PROVISION_AWS_AGENT == 'true' && env.TRIGGER_INTEGRATION_SYNC == 'true'
        env:
          BALKANID_PUBLIC_API_URL: ${{ secrets.BALKANID_PUBLIC_API_URL || vars.BALKANID_PUBLIC_API_URL }}
          API_KEY_ID: ${{ secrets.BALKANID_API_KEY_ID }}
          API_KEY_SECRET: ${{ secrets.BALKANID_API_KEY_SECRET }}
          INTEGRATION_ID: ${{ secrets.BALKANID_INTEGRATION_ID || vars.BALKANID_INTEGRATION_ID }}
          TRIGGER_INTEGRATION_SYNC: ${{ env.TRIGGER_INTEGRATION_SYNC }}
        run: |
          set +x
          if [[ -z "${INTEGRATION_ID}" ]]; then
            echo "::warning::Integration id not set — skipping post-apply sync"
            exit 0
          fi
          cd "${{ github.workspace }}/scripts"
          python3 trigger_sync.py

      - name: Gates-only complete
        if: github.event.inputs.operation == 'apply' && env.PROVISION_AWS_AGENT != 'true'
        run: echo "::notice::Gates approved. PROVISION_AWS_AGENT=false — no AWS resources to apply."

      - name: Terraform destroy
        if: github.event.inputs.operation == 'destroy' && env.PROVISION_AWS_AGENT == 'true'
        working-directory: terraform/bedrock
        env:
          TF_VAR_aws_credentials_file: /tmp/terraform-aws-credentials
          TF_VAR_aws_account_id: ${{ steps.aws_account.outputs.account_id }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_agent_name: ${{ env.AGENT_NAME }}
          TF_VAR_agent_backend: ${{ env.AGENT_BACKEND }}
        run: terraform destroy -auto-approve -input=false -no-color

      - name: AgentCore memory cleanup
        if: github.event.inputs.operation == 'destroy' && env.PROVISION_AWS_AGENT == 'true' && env.AGENT_BACKEND == 'agentcore'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AGENT_NAME: ${{ env.AGENT_NAME }}
        run: bash scripts/cleanup-agentcore-memory.sh

      - name: Destroy skipped (gate-only)
        if: github.event.inputs.operation == 'destroy' && env.PROVISION_AWS_AGENT != 'true'
        run: echo "::notice::PROVISION_AWS_AGENT=false — no Terraform state/AWS resources to destroy."

      - name: Apply complete
        if: github.event.inputs.operation == 'apply' && env.PROVISION_AWS_AGENT == 'true'
        working-directory: terraform/bedrock
        run: echo "::notice::Terraform apply finished. Resource ids are in workflow state cache — not printed to logs."
