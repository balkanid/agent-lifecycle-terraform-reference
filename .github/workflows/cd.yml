name: CD

# Runs terraform apply (or destroy) against a live BalkanID tenant.
# Apply blocks on scripts/gate.py until the access request is approved or denied.
#
# Configure the agent-lifecycle GitHub environment:
#   Variables — non-sensitive defaults (see .github/CD_CONFIG.md)
#   Secrets   — API keys and AWS credentials

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      agent_name:
        description: Override AGENT_NAME variable for this run (leave blank to use environment variable)
        required: false
        default: ""
        type: string
      approval_wait_minutes:
        description: Override APPROVAL_WAIT_MINUTES variable for this run (leave blank to use environment variable)
        required: false
        default: ""
        type: string

concurrency:
  group: agent-lifecycle-cd-${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: "${{ github.event.inputs.operation }} (${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }})"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.approval_wait_minutes != '' && github.event.inputs.approval_wait_minutes || vars.APPROVAL_WAIT_MINUTES || '120') + 20 }}
    environment: agent-lifecycle
    env:
      ENABLE_BEDROCK: ${{ vars.ENABLE_BEDROCK || 'false' }}
      APPROVAL_WAIT_MINUTES: ${{ github.event.inputs.approval_wait_minutes != '' && github.event.inputs.approval_wait_minutes || vars.APPROVAL_WAIT_MINUTES || '120' }}
      AGENT_NAME: ${{ github.event.inputs.agent_name != '' && github.event.inputs.agent_name || vars.AGENT_NAME || 'demo-support-agent' }}
      BALKANID_PUBLIC_API_URL: ${{ vars.BALKANID_PUBLIC_API_URL }}
      BALKANID_AGENT_OWNER_EMAIL: ${{ vars.BALKANID_AGENT_OWNER_EMAIL }}
      BALKANID_INTEGRATION_ID: ${{ vars.BALKANID_INTEGRATION_ID }}
      AGENT_PURPOSE: ${{ vars.AGENT_PURPOSE || 'Agent lifecycle CD pipeline demo' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: |
            terraform/.terraform
            terraform/terraform.tfstate
            terraform/terraform.tfstate.backup
          key: tfstate-${{ env.AGENT_NAME }}-${{ github.ref_name }}
          restore-keys: |
            tfstate-${{ env.AGENT_NAME }}-

      - name: Configure AWS credentials
        if: env.ENABLE_BEDROCK == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Gate + apply
        if: github.event.inputs.operation == 'apply'
        env:
          TF_VAR_enable_bedrock: ${{ env.ENABLE_BEDROCK }}
          TF_VAR_balkanid_public_api_url: ${{ env.BALKANID_PUBLIC_API_URL }}
          TF_VAR_api_key_id: ${{ secrets.BALKANID_API_KEY_ID }}
          TF_VAR_api_key_secret: ${{ secrets.BALKANID_API_KEY_SECRET }}
          TF_VAR_agent_owner_email: ${{ env.BALKANID_AGENT_OWNER_EMAIL }}
          TF_VAR_integration_id: ${{ env.BALKANID_INTEGRATION_ID }}
          TF_VAR_agent_name: ${{ env.AGENT_NAME }}
          TF_VAR_agent_purpose: ${{ env.AGENT_PURPOSE }}
          TF_VAR_poll_seconds: "5"
          TF_VAR_poll_timeout_seconds: ${{ fromJSON(env.APPROVAL_WAIT_MINUTES) * 60 }}
        run: |
          echo "::notice::enable_bedrock=${ENABLE_BEDROCK} (environment variable ENABLE_BEDROCK)"
          echo "::notice::Terraform apply will block until the BalkanID access request is approved or denied."
          echo "::notice::Waiting up to ${APPROVAL_WAIT_MINUTES} minutes for approval."
          echo "::notice::Open your tenant → Access Requests while this job runs."
          terraform apply -auto-approve -input=false

      - name: Destroy (no BalkanID gate)
        if: github.event.inputs.operation == 'destroy'
        env:
          TF_VAR_enable_bedrock: ${{ env.ENABLE_BEDROCK }}
          TF_VAR_balkanid_public_api_url: ${{ env.BALKANID_PUBLIC_API_URL }}
          TF_VAR_api_key_id: ${{ secrets.BALKANID_API_KEY_ID }}
          TF_VAR_api_key_secret: ${{ secrets.BALKANID_API_KEY_SECRET }}
          TF_VAR_agent_owner_email: ${{ env.BALKANID_AGENT_OWNER_EMAIL }}
          TF_VAR_integration_id: ${{ env.BALKANID_INTEGRATION_ID }}
          TF_VAR_agent_name: ${{ env.AGENT_NAME }}
          TF_VAR_agent_purpose: ${{ env.AGENT_PURPOSE }}
        run: terraform destroy -auto-approve -input=false

      - name: Outputs
        if: github.event.inputs.operation == 'apply'
        run: terraform output -json
